<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#000000">
    <link rel="manifest" href="manifest.json">
    <title>奥越・美山 現場電子黒板カメラ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

    <style>
        body {
            touch-action: manipulation;
            -webkit-user-select: none;
            user-select: none;
            background-color: #000000;
        }
        .font-chalk {
            font-family: "Hiragino Kaku Gothic ProN", "メイリオ", sans-serif;
            font-weight: 700;
        }
        .board-theme-black { background: linear-gradient(135deg, #18181b, #09090b); border: 3px solid #3f3f46; color: #ffffff; }
        .board-theme-green { background: linear-gradient(135deg, #14532d, #064e3b); border: 3px solid #854d0e; color: #fef08a; }
        .board-theme-white { background: linear-gradient(135deg, #ffffff, #f4f4f5); border: 3px solid #71717a; color: #09090b; }
        
        /* 横持ち（90度回転）時に黒板を自動回転 */
        @media (orientation: landscape) {
            .auto-rotate-board {
                transform: rotate(-90deg);
                transform-origin: center center;
            }
            .icon-rotate {
                transform: rotate(-90deg);
            }
        }

        @keyframes focusPulse {
            0% { transform: scale(1.3); opacity: 1; }
            50% { transform: scale(0.9); opacity: 0.8; }
            100% { transform: scale(1.0); opacity: 0; }
        }
        .focus-ring {
            position: absolute;
            width: 50px;
            height: 50px;
            border: 2px solid #eab308;
            border-radius: 50%;
            pointer-events: none;
            animation: focusPulse 0.8s forwards;
            z-index: 40;
        }
    </style>
</head>
<body class="text-slate-100 flex flex-col h-screen h-[100dvh] overflow-hidden bg-black">

    <!-- ヘッダーバー -->
    <header class="bg-black/90 px-3 py-1.5 flex items-center justify-between z-30 shrink-0 border-b border-white/10 h-10">
        <div class="flex items-center space-x-1.5">
            <span class="bg-emerald-600 text-xs font-bold px-1.5 py-0.5 rounded text-white icon-rotate">奥越・美山</span>
            <h1 class="text-xs font-bold text-white icon-rotate">電子黒板カメラ</h1>
        </div>
        <div class="flex items-center space-x-1">
            <button onclick="switchCameraDevice()" class="bg-zinc-800 text-xs text-white px-2 py-0.5 rounded-full border border-white/20 icon-rotate">📷切替</button>
            <select id="userSelect" onchange="switchUser(this.value)" class="bg-zinc-800 border border-white/20 text-xs text-white rounded-full px-1.5 py-0.5">
                <option value="作業員A">作業員A</option>
                <option value="作業員B">作業員B</option>
                <option value="現場監督">現場監督</option>
                <option value="+新規追加">+新規</option>
            </select>
            <button onclick="openModal('logModal')" class="bg-zinc-800 text-xs text-white px-2 py-0.5 rounded-full border border-white/20 icon-rotate">📋台帳</button>
        </div>
    </header>

    <!-- カメラメイン枠 -->
    <main id="cameraContainer" onclick="handleTapToFocus(event)" class="relative flex-1 bg-black flex items-center justify-center overflow-hidden w-full min-h-0">
        <video id="webcam" autoplay playsinline class="absolute inset-0 w-full h-full object-cover"></video>
        
        <!-- 自動回転可動黒板 -->
        <div id="blackboard" class="absolute z-20 cursor-move rounded-md p-2 font-chalk board-theme-green shadow-2xl inline-block auto-rotate-board"
             style="top: 15px; left: 15px; width: 220px; touch-action: none;">
            <div class="flex justify-between items-center border-b border-current/20 pb-0.5 mb-1 text-xs opacity-80">
                <span class="font-mono" id="bb-date">2026/10/15</span>
                <span class="text-[10px] bg-black/30 px-1 py-0.5 rounded" id="bb-user">作業員A</span>
            </div>
            <div id="bb-row-project" class="mb-1">
                <div class="text-[9px] opacity-70">工事名</div>
                <div id="bb-project" class="text-xs font-bold truncate">大野市朝晴町 水道管修繕工事</div>
            </div>
            <div id="bb-row-type-loc" class="grid grid-cols-2 gap-1 border-t border-current/20 pt-0.5 mb-1">
                <div id="bb-box-type">
                    <div class="text-[9px] opacity-70">工種</div>
                    <div id="bb-type" class="text-xs font-bold truncate">配管工</div>
                </div>
                <div id="bb-box-location">
                    <div class="text-[9px] opacity-70">測点</div>
                    <div id="bb-location" class="text-xs font-bold truncate">No.3 + 5.0m</div>
                </div>
            </div>
            <div id="bb-row-remarks" class="border-t border-current/20 pt-0.5">
                <div class="text-[9px] opacity-70">備考 / 施工状況</div>
                <div id="bb-remarks" class="text-[10px] break-words line-clamp-2">掘削完了 舗装版破砕</div>
            </div>
        </div>

        <div class="absolute top-2 left-2 z-10 bg-black/60 border border-white/20 px-2 py-0.5 rounded-full text-xs text-slate-300 flex items-center space-x-1 icon-rotate">
            <span id="gpsIndicator" class="w-1.5 h-1.5 rounded-full bg-amber-500 animate-pulse"></span>
            <span id="gpsText">GPS取得中...</span>
        </div>

        <div id="focusLayer"></div>
        <canvas id="captureCanvas" class="hidden"></canvas>
    </main>

    <!-- 下部標準カメラ操作バー（絶対に見切れない固定表示エリア） -->
    <div class="bg-black px-3 py-2 z-30 shrink-0 space-y-2 border-t border-zinc-900">
        <!-- 倍率ボタン ＆ 黒板色選択 -->
        <div class="flex items-center justify-between px-2">
            <div class="flex items-center space-x-2">
                <button id="zoomBtn06" onclick="setZoomFactor(0.6)" class="zoom-btn w-8 h-8 rounded-full bg-zinc-900 border border-white/20 text-xs font-bold text-white flex items-center justify-center icon-rotate">0.6x</button>
                <button id="zoomBtn1"  onclick="setZoomFactor(1.0)" class="zoom-btn w-8 h-8 rounded-full bg-emerald-600 border border-white/20 text-xs font-bold text-white flex items-center justify-center icon-rotate">1x</button>
                <button id="zoomBtn2"  onclick="setZoomFactor(2.0)" class="zoom-btn w-8 h-8 rounded-full bg-zinc-900 border border-white/20 text-xs font-bold text-white flex items-center justify-center icon-rotate">2x</button>
                <button id="zoomBtn3"  onclick="setZoomFactor(3.0)" class="zoom-btn w-8 h-8 rounded-full bg-zinc-900 border border-white/20 text-xs font-bold text-white flex items-center justify-center icon-rotate">3x</button>
            </div>
            
            <div class="flex items-center space-x-2 shrink-0">
                <button onclick="setTheme('black')" class="w-4 h-4 rounded-full bg-zinc-900 border border-zinc-600"></button>
                <button onclick="setTheme('green')" class="w-4 h-4 rounded-full bg-emerald-800 border border-emerald-500"></button>
                <button onclick="setTheme('white')" class="w-4 h-4 rounded-full bg-white border border-slate-400"></button>
            </div>
        </div>

        <!-- 撮影ボタン ＆ モーダル起動ボタン -->
        <div class="flex items-center justify-around py-1">
            <button onclick="openModal('ocrModal')" class="w-12 h-12 bg-zinc-900 border border-white/20 rounded-full flex flex-col items-center justify-center text-white icon-rotate active:scale-95">
                <span class="text-sm">📄</span>
                <span class="text-[9px] font-bold">OCR</span>
            </button>

            <!-- 丸型撮影シャッターボタン -->
            <button onclick="takePhoto()" class="w-16 h-16 rounded-full border-4 border-white bg-transparent flex items-center justify-center active:scale-90 transition-transform">
                <div class="w-12 h-12 rounded-full bg-white"></div>
            </button>

            <!-- 黒板編集ボタン -->
            <button onclick="openModal('editModal')" class="w-12 h-12 bg-zinc-900 border border-white/20 rounded-full flex flex-col items-center justify-center text-white icon-rotate active:scale-95">
                <span class="text-sm">✏️</span>
                <span class="text-[9px] font-bold">編集</span>
            </button>
        </div>
    </div>

    <!-- 黒板編集モーダル -->
    <div id="editModal" class="fixed inset-0 bg-black/95 z-50 hidden flex flex-col p-4 overflow-y-auto">
        <div class="flex justify-between items-center border-b border-zinc-800 pb-2">
            <h2 class="text-sm font-bold text-white">✏️ 黒板記載事項の修正</h2>
            <button onclick="closeModal('editModal')" class="text-slate-400 text-xl font-bold px-2">&times;</button>
        </div>
        <div class="mt-4 space-y-3 flex-1">
            <div>
                <label class="block text-xs text-slate-400 mb-1">工事名</label>
                <div class="flex space-x-2">
                    <input type="text" id="inputProject" class="flex-1 bg-zinc-900 border border-zinc-800 rounded p-2 text-sm text-slate-100">
                    <button onclick="startVoiceInput('inputProject')" class="bg-zinc-800 px-3 rounded text-sm text-emerald-400 border border-zinc-700">🎤</button>
                </div>
            </div>
            <div>
                <label class="block text-xs text-slate-400 mb-1">工種</label>
                <div class="flex space-x-2">
                    <input type="text" id="inputType" class="flex-1 bg-zinc-900 border border-zinc-800 rounded p-2 text-sm text-slate-100">
                    <button onclick="startVoiceInput('inputType')" class="bg-zinc-800 px-3 rounded text-sm text-emerald-400 border border-zinc-700">🎤</button>
                </div>
            </div>
            <div>
                <label class="block text-xs text-slate-400 mb-1">測点</label>
                <div class="flex space-x-2">
                    <input type="text" id="inputLocation" class="flex-1 bg-zinc-900 border border-zinc-800 rounded p-2 text-sm text-slate-100">
                    <button onclick="startVoiceInput('inputLocation')" class="bg-zinc-800 px-3 rounded text-sm text-emerald-400 border border-zinc-700">🎤</button>
                </div>
            </div>
            <div>
                <label class="block text-xs text-slate-400 mb-1">備考 / 施工状況</label>
                <div class="flex space-x-2">
                    <textarea id="inputRemarks" rows="2" class="flex-1 bg-zinc-900 border border-zinc-800 rounded p-2 text-sm text-slate-100"></textarea>
                    <button onclick="startVoiceInput('inputRemarks')" class="bg-zinc-800 px-3 rounded text-sm text-emerald-400 border border-zinc-700">🎤</button>
                </div>
            </div>
            <button onclick="saveEditModal()" class="w-full bg-emerald-600 text-white font-bold py-3 rounded-lg text-sm mt-4">黒板に反映</button>
        </div>
    </div>

    <!-- OCRモーダル -->
    <div id="ocrModal" class="fixed inset-0 bg-black/95 z-50 hidden flex flex-col p-4 overflow-y-auto">
        <div class="flex justify-between items-center border-b border-zinc-800 pb-2">
            <h2 class="text-sm font-bold text-white">📄 伝票解析 ＆ 地名補正</h2>
            <button onclick="closeModal('ocrModal')" class="text-slate-400 text-xl font-bold px-2">&times;</button>
        </div>
        <div class="mt-4 space-y-3 flex-1">
            <div class="bg-zinc-900 border border-zinc-800 rounded-lg p-3">
                <input type="file" id="ocrFileInput" accept="image/*" onchange="processOcrImage(event)" class="text-xs text-slate-400 file:mr-2 file:py-1 file:px-3 file:rounded file:border-0 file:bg-emerald-600 file:text-white w-full"/>
            </div>
            <div class="bg-zinc-900 border border-zinc-800 rounded-lg p-3">
                <textarea id="ocrRawInput" rows="2" placeholder="伝票テキストを入力" class="w-full bg-black border border-zinc-800 rounded p-2 text-xs text-slate-200"></textarea>
                <button onclick="parseRawText()" class="mt-2 w-full bg-zinc-800 text-xs font-bold py-2 rounded text-emerald-400">テキスト照合実行</button>
            </div>
            <div id="ocrResultBox" class="hidden bg-zinc-900 border border-emerald-500/50 rounded-lg p-3 space-y-2">
                <input type="text" id="resProject" class="w-full bg-black border border-zinc-800 rounded p-2 text-xs text-white">
                <button onclick="applyOcrToBoard()" class="w-full bg-emerald-600 text-white text-xs font-bold py-2 rounded">黒板へ反映</button>
            </div>
        </div>
    </div>

    <!-- ログ台帳モーダル -->
    <div id="logModal" class="fixed inset-0 bg-black/95 z-50 hidden flex flex-col p-4">
        <div class="flex justify-between items-center border-b border-zinc-800 pb-2">
            <h2 class="text-sm font-bold text-white">📋 撮影ログ台帳</h2>
            <button onclick="closeModal('logModal')" class="text-slate-400 text-xl font-bold px-2">&times;</button>
        </div>
        <div id="logTableBody" class="flex-1 overflow-y-auto mt-2 space-y-2"></div>
    </div>

    <script>
        const GOOGLE_GAS_URL = "https://script.google.com/macros/s/AKfycby0y8MW4ZGf92xM_a2u_mMLKwbSryXbp_r4dalWZeqq_FupJw5-sX8rc3rxLa_YBTupow/exec";
        const GOOGLE_FOLDER_ID = "12HcTx8JlngRIG78T4-Kai1AU-P_Fo-hC";

        let currentGps = { text: "未取得" };
        let currentUser = "作業員A";
        let visibility = { blackboard: true, project: true, type: true, location: true, remarks: true };
        let boardState = { project: "大野市朝晴町 水道管修繕工事", type: "配管工", location: "No.3 + 5.0m", remarks: "掘削完了 舗装版破砕" };

        let videoDevices = [];
        let currentDeviceIndex = 0;
        let currentStream = null;
        let videoTrack = null;

        window.addEventListener('DOMContentLoaded', async () => {
            await initCameraDevices();
            initGps();
            initDragEngine();
            updateBoardUI();
        });

        async function initCameraDevices() {
            try {
                const devices = await navigator.mediaDevices.enumerateDevices();
                videoDevices = devices.filter(d => d.kind === 'videoinput');
                let defaultIndex = videoDevices.findIndex(d => d.label.toLowerCase().includes('back') || d.label.toLowerCase().includes('rear') || d.label.toLowerCase().includes('environment'));
                currentDeviceIndex = defaultIndex !== -1 ? defaultIndex : 0;
                await startCameraStream();
            } catch (err) {
                alert("カメラの起動許可を確認してください。");
            }
        }

        async function startCameraStream(customDeviceId = null) {
            if (currentStream) currentStream.getTracks().forEach(t => t.stop());
            const video = document.getElementById('webcam');
            
            let deviceIdToUse = customDeviceId;
            if (!deviceIdToUse && videoDevices[currentDeviceIndex]) {
                deviceIdToUse = videoDevices[currentDeviceIndex].deviceId;
            }

            const constraints = {
                video: deviceIdToUse ? { deviceId: { exact: deviceIdToUse } } : { facingMode: "environment" },
                audio: false
            };
            try {
                currentStream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = currentStream;
                videoTrack = currentStream.getVideoTracks()[0];
            } catch (err) {
                console.error("Camera Error:", err);
            }
        }

        async function setZoomFactor(val) {
            // 倍率ボタンの表示（緑色ハイライト）更新
            document.querySelectorAll('.zoom-btn').forEach(btn => btn.className = "zoom-btn w-8 h-8 rounded-full bg-zinc-900 border border-white/20 text-xs font-bold text-white flex items-center justify-center icon-rotate");
            if (val === 0.6) document.getElementById('zoomBtn06').className = "zoom-btn w-8 h-8 rounded-full bg-emerald-600 border border-white/20 text-xs font-bold text-white flex items-center justify-center icon-rotate";
            if (val === 1.0) document.getElementById('zoomBtn1').className = "zoom-btn w-8 h-8 rounded-full bg-emerald-600 border border-white/20 text-xs font-bold text-white flex items-center justify-center icon-rotate";
            if (val === 2.0) document.getElementById('zoomBtn2').className = "zoom-btn w-8 h-8 rounded-full bg-emerald-600 border border-white/20 text-xs font-bold text-white flex items-center justify-center icon-rotate";
            if (val === 3.0) document.getElementById('zoomBtn3').className = "zoom-btn w-8 h-8 rounded-full bg-emerald-600 border border-white/20 text-xs font-bold text-white flex items-center justify-center icon-rotate";

            if (val === 0.6) {
                const wideDevice = videoDevices.find(d => 
                    d.label.toLowerCase().includes('wide') || 
                    d.label.toLowerCase().includes('ultra') || 
                    d.label.toLowerCase().includes('広角') ||
                    d.label.toLowerCase().includes('0.6')
                );
                if (wideDevice) {
                    await startCameraStream(wideDevice.deviceId);
                    return;
                }
            }
            
            if (videoTrack && typeof videoTrack.applyConstraints === 'function') {
                videoTrack.applyConstraints({ advanced: [{ zoom: parseFloat(val) }] }).catch(() => {});
            }
        }

        async function switchCameraDevice() {
            if (videoDevices.length < 2) return;
            currentDeviceIndex = (currentDeviceIndex + 1) % videoDevices.length;
            await startCameraStream();
        }

        function handleTapToFocus(e) {
            if (e.target.closest('#blackboard') || e.target.closest('button')) return;
            const container = document.getElementById('cameraContainer');
            const rect = container.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            const layer = document.getElementById('focusLayer');
            layer.innerHTML = `<div class="focus-ring" style="left: ${x - 25}px; top: ${y - 25}px;"></div>`;
            setTimeout(() => { layer.innerHTML = ''; }, 800);
            if (videoTrack && typeof videoTrack.applyConstraints === 'function') {
                videoTrack.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }).catch(() => {});
            }
        }

        function initGps() {
            if ("geolocation" in navigator) {
                navigator.geolocation.watchPosition((pos) => {
                    currentGps.text = `${pos.coords.latitude.toFixed(6)}, ${pos.coords.longitude.toFixed(6)}`;
                    document.getElementById('gpsIndicator').className = "w-1.5 h-1.5 rounded-full bg-emerald-500";
                    document.getElementById('gpsText').innerText = `GPS: ${currentGps.text}`;
                }, () => {}, { enableHighAccuracy: true });
            }
        }

        function initDragEngine() {
            const bb = document.getElementById('blackboard');
            const container = document.getElementById('cameraContainer');
            let isDragging = false, startX = 0, startY = 0, initialLeft = 0, initialTop = 0;
            const getCoords = (e) => (e.touches ? { x: e.touches[0].clientX, y: e.touches[0].clientY } : { x: e.clientX, y: e.clientY });

            const startDrag = (e) => {
                isDragging = true;
                const c = getCoords(e);
                startX = c.x; startY = c.y;
                const rect = bb.getBoundingClientRect();
                const containerRect = container.getBoundingClientRect();
                initialLeft = rect.left - containerRect.left;
                initialTop = rect.top - containerRect.top;
            };

            const moveDrag = (e) => {
                if (!isDragging) return;
                const c = getCoords(e);
                const containerRect = container.getBoundingClientRect();
                let newLeft = Math.max(0, Math.min(initialLeft + (c.x - startX), containerRect.width - bb.offsetWidth));
                let newTop = Math.max(0, Math.min(initialTop + (c.y - startY), containerRect.height - bb.offsetHeight));
                bb.style.left = `${newLeft}px`;
                bb.style.top = `${newTop}px`;
            };

            const stopDrag = () => { isDragging = false; };
            bb.addEventListener('mousedown', startDrag); window.addEventListener('mousemove', moveDrag); window.addEventListener('mouseup', stopDrag);
            bb.addEventListener('touchstart', startDrag, { passive: true }); window.addEventListener('touchmove', moveDrag, { passive: true }); window.addEventListener('touchend', stopDrag);
        }

        function setTheme(theme) {
            const bb = document.getElementById('blackboard');
            bb.classList.remove('board-theme-black', 'board-theme-green', 'board-theme-white');
            bb.classList.add(`board-theme-${theme}`);
        }

        function switchUser(val) {
            currentUser = val;
            document.getElementById('bb-user').innerText = `${currentUser}`;
        }

        function updateBoardUI() {
            document.getElementById('bb-project').innerText = boardState.project;
            document.getElementById('bb-type').innerText = boardState.type;
            document.getElementById('bb-location').innerText = boardState.location;
            document.getElementById('bb-remarks').innerText = boardState.remarks;
            document.getElementById('inputProject').value = boardState.project;
            document.getElementById('inputType').value = boardState.type;
            document.getElementById('inputLocation').value = boardState.location;
            document.getElementById('inputRemarks').value = boardState.remarks;
        }

        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        function startVoiceInput(targetInputId) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) return alert("お使いのブラウザは音声入力非対応です。キーボードのマイク機能をお使いください。");
            try {
                const recognition = new SpeechRecognition();
                recognition.lang = 'ja-JP';
                recognition.onresult = (e) => {
                    document.getElementById(targetInputId).value = e.results[0][0].transcript;
                };
                recognition.start();
            } catch (err) {
                alert("音声入力の起動に失敗しました。");
            }
        }

        function saveEditModal() {
            boardState.project = document.getElementById('inputProject').value;
            boardState.type = document.getElementById('inputType').value;
            boardState.location = document.getElementById('inputLocation').value;
            boardState.remarks = document.getElementById('inputRemarks').value;
            updateBoardUI();
            closeModal('editModal');
        }

        function takePhoto() {
            const video = document.getElementById('webcam');
            const canvas = document.getElementById('captureCanvas');
            const ctx = canvas.getContext('2d');
            if (!video.videoWidth) return alert("カメラ準備中です。");

            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            const now = new Date();
            const fileName = `${boardState.project}_${now.getTime()}.jpg`;
            const dataUrl = canvas.toDataURL('image/jpeg', 0.9);

            const a = document.createElement('a');
            a.href = dataUrl;
            a.download = fileName;
            a.click();
        }
    </script>
</body>
</html>
