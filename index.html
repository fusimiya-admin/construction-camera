<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#000000">
    <link rel="manifest" href="manifest.json">
    
    <title>奥越・美山 現場電子黒板カメラ</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

    <style>
        body {
            touch-action: manipulation;
            -webkit-user-select: none;
            user-select: none;
            background-color: #000000;
        }
        .font-chalk {
            font-family: "Hiragino Kaku Gothic ProN", "メイリオ", sans-serif;
            font-weight: 700;
            letter-spacing: 0.05em;
        }
        .board-theme-black {
            background: linear-gradient(135deg, #18181b, #09090b);
            border: 4px solid #3f3f46;
            color: #ffffff;
        }
        .board-theme-green {
            background: linear-gradient(135deg, #14532d, #064e3b);
            border: 4px solid #854d0e;
            color: #fef08a;
        }
        .board-theme-white {
            background: linear-gradient(135deg, #ffffff, #f4f4f5);
            border: 4px solid #71717a;
            color: #09090b;
        }
        
        /* 90度回転時のアイコン回転アニメーション */
        .icon-rotate {
            transition: transform 0.3s ease;
        }
        @media (orientation: landscape) {
            .icon-rotate {
                transform: rotate(-90deg);
            }
        }

        /* フォーカスリングアニメーション */
        @keyframes focusPulse {
            0% { transform: scale(1.3); opacity: 1; }
            50% { transform: scale(0.9); opacity: 0.8; }
            100% { transform: scale(1.0); opacity: 0; }
        }
        .focus-ring {
            position: absolute;
            width: 60px;
            height: 60px;
            border: 2px solid #eab308;
            border-radius: 50%;
            pointer-events: none;
            animation: focusPulse 0.8s forwards;
            z-index: 40;
        }
    </style>
</head>

<body class="text-slate-100 flex flex-col h-screen h-[100dvh] overflow-hidden bg-black select-none">

    <!-- Application Script -->
    <script>
        const GOOGLE_GAS_URL = "https://script.google.com/macros/s/AKfycby0y8MW4ZGf92xM_a2u_mMLKwbSryXbp_r4dalWZeqq_FupJw5-sX8rc3rxLa_YBTupow/exec";
        const GOOGLE_FOLDER_ID = "12HcTx8JlngRIG78T4-Kai1AU-P_Fo-hC";

        const LOCATION_DICTIONARY = [
            "大野市", "明倫町", "城町", "天神町", "本町", "元町", "錦町", "日吉町", "月見町", "神明町",
            "水落町", "新田町", "中野", "朝日町", "春日", "神代", "蕨生", "牛ヶ原", "鍬掛", "友江",
            "上庄", "中庄", "下庄", "富嶋", "首山", "森目", "阪谷", "萩野", "落合", "中島", "勝原",
            "角野", "箱ヶ瀬", "九頭竜", "和泉", "穴野", "貝皿", "野中", "東中野", "西中野", "木本",
            "勝山市", "遅羽町", "比島", "鹿谷町", "北谷町", "荒土町", "村岡町", "平泉寺町",
            "福井市美山町", "美山", "朝谷", "市波", "小宇坂", "大宇坂", "神波", "境寺", "蔵作", "高田"
        ];

        let currentGps = { lat: null, lng: null, text: "未取得" };
        let currentUser = "作業員A";
        
        let visibility = { blackboard: true, project: true, type: true, location: true, remarks: true };
        let boardState = {
            project: "大野市朝晴町 水道管修繕工事",
            type: "配管工",
            location: "No.3 + 5.0m",
            remarks: "掘削完了 舗装版破砕"
        };

        let videoDevices = [];
        let currentDeviceIndex = 0;
        let currentStream = null;
        let videoTrack = null;

        window.addEventListener('DOMContentLoaded', async () => {
            await initCameraDevices();
            initGps();
            initDragEngine();
            updateBoardUI();
            updateDateUI();
            loadLogsUI();
        });

        function updateDateUI() {
            const now = new Date();
            const dateStr = now.getFullYear() + '/' + 
                String(now.getMonth() + 1).padStart(2, '0') + '/' + 
                String(now.getDate()).padStart(2, '0');
            document.getElementById('bb-date').innerText = dateStr;
        }

        async function initCameraDevices() {
            try {
                const tempStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                tempStream.getTracks().forEach(track => track.stop());

                const devices = await navigator.mediaDevices.enumerateDevices();
                videoDevices = devices.filter(device => device.kind === 'videoinput');

                let defaultIndex = videoDevices.findIndex(d => 
                    d.label.toLowerCase().includes('back') || 
                    d.label.toLowerCase().includes('rear') || 
                    d.label.toLowerCase().includes('environment') ||
                    d.label.toLowerCase().includes('外') ||
                    d.label.toLowerCase().includes('背面')
                );

                currentDeviceIndex = defaultIndex !== -1 ? defaultIndex : 0;
                await startCameraStream();
            } catch (err) {
                alert("カメラの起動に失敗しました。カメラ権限を許可してください。");
            }
        }

        async function startCameraStream() {
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
            }

            const video = document.getElementById('webcam');
            const selectedDevice = videoDevices[currentDeviceIndex];

            const constraints = {
                video: selectedDevice ? { 
                    deviceId: { exact: selectedDevice.deviceId },
                    width: { ideal: 3840 },
                    height: { ideal: 2160 }
                } : { 
                    facingMode: "environment",
                    width: { ideal: 3840 },
                    height: { ideal: 2160 }
                },
                audio: false
            };

            try {
                currentStream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = currentStream;
                videoTrack = currentStream.getVideoTracks()[0];
            } catch (err) {
                console.error("カメラ起動エラー:", err);
            }
        }

        function setZoomFactor(val) {
            if (videoTrack && typeof videoTrack.applyConstraints === 'function') {
                videoTrack.applyConstraints({ advanced: [{ zoom: parseFloat(val) }] }).catch(() => {
                    console.log("指定倍率は端末側でサポートされていません");
                });
            }
        }

        async function switchCameraDevice() {
            if (videoDevices.length < 2) {
                alert("切り替え可能な追加カメラが検出されませんでした。");
                return;
            }
            currentDeviceIndex = (currentDeviceIndex + 1) % videoDevices.length;
            await startCameraStream();
        }

        function handleTapToFocus(e) {
            // 黒板やUI要素のタップはフォーカスリングを出さない
            if (e.target.closest('#blackboard') || e.target.closest('button')) return;

            const container = document.getElementById('cameraContainer');
            const rect = container.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            const layer = document.getElementById('focusLayer');
            layer.innerHTML = `<div class="focus-ring" style="left: ${x - 30}px; top: ${y - 30}px;"></div>`;
            setTimeout(() => { layer.innerHTML = ''; }, 800);

            // カメラにフォーカス再リクエスト
            if (videoTrack && typeof videoTrack.applyConstraints === 'function') {
                videoTrack.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }).catch(() => {});
            }
        }

        function initGps() {
            if ("geolocation" in navigator) {
                navigator.geolocation.watchPosition(
                    (pos) => {
                        currentGps.lat = pos.coords.latitude.toFixed(6);
                        currentGps.lng = pos.coords.longitude.toFixed(6);
                        currentGps.text = `${currentGps.lat}, ${currentGps.lng}`;
                        document.getElementById('gpsIndicator').className = "w-1.5 h-1.5 rounded-full bg-emerald-500";
                        document.getElementById('gpsText').innerText = `GPS: ${currentGps.text}`;
                    },
                    (err) => {
                        document.getElementById('gpsIndicator').className = "w-1.5 h-1.5 rounded-full bg-rose-500";
                        document.getElementById('gpsText').innerText = "GPS未取得";
                    },
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                );
            }
        }

        function initDragEngine() {
            const bb = document.getElementById('blackboard');
            const container = document.getElementById('cameraContainer');
            let isDragging = false;
            let startX = 0, startY = 0;
            let initialLeft = 0, initialTop = 0;

            const getClientCoords = (e) => {
                if (e.touches && e.touches.length > 0) {
                    return { x: e.touches[0].clientX, y: e.touches[0].clientY };
                }
                return { x: e.clientX, y: e.clientY };
            };

            const startDrag = (e) => {
                isDragging = true;
                const coords = getClientCoords(e);
                startX = coords.x;
                startY = coords.y;
                const rect = bb.getBoundingClientRect();
                const containerRect = container.getBoundingClientRect();
                initialLeft = rect.left - containerRect.left;
                initialTop = rect.top - containerRect.top;
            };

            const moveDrag = (e) => {
                if (!isDragging) return;
                const coords = getClientCoords(e);
                const deltaX = coords.x - startX;
                const deltaY = coords.y - startY;

                const containerRect = container.getBoundingClientRect();
                let newLeft = initialLeft + deltaX;
                let newTop = initialTop + deltaY;

                newLeft = Math.max(0, Math.min(newLeft, containerRect.width - bb.offsetWidth));
                newTop = Math.max(0, Math.min(newTop, containerRect.height - bb.offsetHeight));

                bb.style.left = `${newLeft}px`;
                bb.style.top = `${newTop}px`;
            };

            const stopDrag = () => { isDragging = false; };

            bb.addEventListener('mousedown', startDrag);
            window.addEventListener('mousemove', moveDrag);
            window.addEventListener('mouseup', stopDrag);
            bb.addEventListener('touchstart', startDrag, { passive: true });
            window.addEventListener('touchmove', moveDrag, { passive: true });
            window.addEventListener('touchend', stopDrag);
        }

        function toggleBbElement(target) {
            visibility[target] = !visibility[target];
            if (target === 'blackboard') {
                document.getElementById('blackboard').style.display = visibility.blackboard ? 'block' : 'none';
            } else if (target === 'project') {
                document.getElementById('bb-row-project').style.display = visibility.project ? 'block' : 'none';
            } else if (target === 'type') {
                document.getElementById('bb-box-type').style.display = visibility.type ? 'block' : 'none';
            } else if (target === 'location') {
                document.getElementById('bb-box-location').style.display = visibility.location ? 'block' : 'none';
            } else if (target === 'remarks') {
                document.getElementById('bb-row-remarks').style.display = visibility.remarks ? 'block' : 'none';
            }
        }

        function setTheme(theme) {
            const bb = document.getElementById('blackboard');
            bb.classList.remove('board-theme-black', 'board-theme-green', 'board-theme-white');
            bb.classList.add(`board-theme-${theme}`);
        }

        function switchUser(val) {
            if (val === "+新規追加") {
                const name = prompt("撮影者の名前を入力してください:");
                if (name) {
                    currentUser = name;
                    const select = document.getElementById('userSelect');
                    const opt = document.createElement('option');
                    opt.value = name;
                    opt.innerText = name;
                    select.insertBefore(opt, select.lastElementChild);
                    select.value = name;
                } else {
                    document.getElementById('userSelect').value = currentUser;
                    return;
                }
            } else {
                currentUser = val;
            }
            document.getElementById('bb-user').innerText = `撮影者: ${currentUser}`;
        }

        function updateBoardUI() {
            document.getElementById('bb-project').innerText = boardState.project;
            document.getElementById('bb-type').innerText = boardState.type;
            document.getElementById('bb-location').innerText = boardState.location;
            document.getElementById('bb-remarks').innerText = boardState.remarks;

            document.getElementById('inputProject').value = boardState.project;
            document.getElementById('inputType').value = boardState.type;
            document.getElementById('inputLocation').value = boardState.location;
            document.getElementById('inputRemarks').value = boardState.remarks;
        }

        function startVoiceInput(targetInputId) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("お使いのブラウザは音声入力に対応していません。(Chrome/Safari推奨)");
                return;
            }
            try {
                const recognition = new SpeechRecognition();
                recognition.lang = 'ja-JP';
                recognition.interimResults = false;

                const targetInput = document.getElementById(targetInputId);
                const originalPlaceholder = targetInput.placeholder;
                targetInput.placeholder = "🎤 話してください...";

                recognition.onresult = (event) => {
                    if (event.results && event.results[0]) {
                        targetInput.value = event.results[0][0].transcript;
                    }
                };
                recognition.onerror = (event) => {
                    alert("音声認識エラー: " + event.error);
                };
                recognition.onend = () => {
                    targetInput.placeholder = originalPlaceholder;
                };
                recognition.start();
            } catch (err) {
                alert("音声入力の起動に失敗しました。マイクの権限を確認してください。");
            }
        }

        function saveEditModal() {
            boardState.project = document.getElementById('inputProject').value;
            boardState.type = document.getElementById('inputType').value;
            boardState.location = document.getElementById('inputLocation').value;
            boardState.remarks = document.getElementById('inputRemarks').value;
            updateBoardUI();
            toggleModal('editModal', false);
        }

        function takePhoto() {
            const video = document.getElementById('webcam');
            const canvas = document.getElementById('captureCanvas');
            const ctx = canvas.getContext('2d');

            if (!video.videoWidth) {
                alert("カメラ映像の準備中です。");
                return;
            }

            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            if (visibility.blackboard) {
                const bb = document.getElementById('blackboard');
                const mainContainer = video.parentElement.getBoundingClientRect();
                const bbRect = bb.getBoundingClientRect();

                const scaleX = canvas.width / mainContainer.width;
                const scaleY = canvas.height / mainContainer.height;

                const drawX = (bbRect.left - mainContainer.left) * scaleX;
                const drawY = (bbRect.top - mainContainer.top) * scaleY;
                const drawWidth = bbRect.width * scaleX;
                const drawHeight = bb.offsetHeight * scaleY;

                let bgColor1 = "#14532d", bgColor2 = "#064e3b", borderColor = "#854d0e", textColor = "#fef08a";
                if (bb.classList.contains('board-theme-black')) {
                    bgColor1 = "#18181b"; bgColor2 = "#09090b"; borderColor = "#3f3f46"; textColor = "#ffffff";
                } else if (bb.classList.contains('board-theme-white')) {
                    bgColor1 = "#ffffff"; bgColor2 = "#f4f4f5"; borderColor = "#71717a"; textColor = "#09090b";
                }

                const grad = ctx.createLinearGradient(drawX, drawY, drawX + drawWidth, drawY + drawHeight);
                grad.addColorStop(0, bgColor1);
                grad.addColorStop(1, bgColor2);
                ctx.fillStyle = grad;
                ctx.fillRect(drawX, drawY, drawWidth, drawHeight);

                ctx.lineWidth = 6 * (drawWidth / 320);
                ctx.strokeStyle = borderColor;
                ctx.strokeRect(drawX, drawY, drawWidth, drawHeight);

                ctx.fillStyle = textColor;
                const scaleFactor = drawWidth / 320;
                const padding = 12 * scaleFactor;
                let currentY = drawY + padding + (20 * scaleFactor);

                ctx.font = `bold ${20 * scaleFactor}px sans-serif`;
                const dateStr = document.getElementById('bb-date').innerText;
                ctx.fillText(`${dateStr}  撮影者: ${currentUser}`, drawX + padding, currentY);

                currentY += 10 * scaleFactor;
                ctx.strokeStyle = textColor;
                ctx.globalAlpha = 0.3;
                ctx.beginPath();
                ctx.moveTo(drawX + padding, currentY);
                ctx.lineTo(drawX + drawWidth - padding, currentY);
                ctx.stroke();
                ctx.globalAlpha = 1.0;

                if (visibility.project) {
                    currentY += 22 * scaleFactor;
                    ctx.font = `${15 * scaleFactor}px sans-serif`;
                    ctx.fillText("工事名", drawX + padding, currentY);
                    currentY += 28 * scaleFactor;
                    ctx.font = `bold ${26 * scaleFactor}px sans-serif`;
                    ctx.fillText(boardState.project, drawX + padding, currentY, drawWidth - (padding * 2));
                }

                if (visibility.type || visibility.location) {
                    currentY += 28 * scaleFactor;
                    ctx.font = `${15 * scaleFactor}px sans-serif`;
                    if (visibility.type) ctx.fillText("工種", drawX + padding, currentY);
                    if (visibility.location) ctx.fillText("測点", drawX + (visibility.type ? drawX + (drawWidth / 2) : drawX + padding), currentY);

                    currentY += 26 * scaleFactor;
                    ctx.font = `bold ${24 * scaleFactor}px sans-serif`;
                    if (visibility.type && visibility.location) {
                        ctx.fillText(boardState.type, drawX + padding, currentY, (drawWidth / 2) - padding);
                        ctx.fillText(boardState.location, drawX + (drawWidth / 2), currentY, (drawWidth / 2) - padding);
                    } else if (visibility.type) {
                        ctx.fillText(boardState.type, drawX + padding, currentY, drawWidth - (padding * 2));
                    } else if (visibility.location) {
                        ctx.fillText(boardState.location, drawX + padding, currentY, drawWidth - (padding * 2));
                    }
                }

                if (visibility.remarks) {
                    currentY += 28 * scaleFactor;
                    ctx.font = `${15 * scaleFactor}px sans-serif`;
                    ctx.fillText("備考 / 施工状況", drawX + padding, currentY);
                    currentY += 24 * scaleFactor;
                    ctx.font = `${20 * scaleFactor}px sans-serif`;
                    ctx.fillText(boardState.remarks, drawX + padding, currentY, drawWidth - (padding * 2));
                }
            }

            const now = new Date();
            const timeStamp = now.getFullYear() +
                String(now.getMonth() + 1).padStart(2, '0') +
                String(now.getDate()).padStart(2, '0') + "_" +
                String(now.getHours()).padStart(2, '0') +
                String(now.getMinutes()).padStart(2, '0');

            const fileName = `${sanitize(boardState.project)}_${sanitize(boardState.type)}_${sanitize(boardState.location)}_${timeStamp}_${currentUser}.jpg`;
            const dataUrl = canvas.toDataURL('image/jpeg', 0.9);

            const a = document.createElement('a');
            a.href = dataUrl;
            a.download = fileName;
            a.click();

            saveLogRecord({
                id: Date.now(),
                fileName: fileName,
                dateTime: now.toLocaleString('ja-JP'),
                user: currentUser,
                project: boardState.project,
                type: boardState.type,
                location: boardState.location,
                remarks: boardState.remarks,
                gps: currentGps.text,
                thumbnail: dataUrl
            });
        }

        function sanitize(str) {
            return str.replace(/[\\/:*?"<>|]/g, '_').replace(/\s+/g, '');
        }

        function saveLogRecord(record) {
            const logs = JSON.parse(localStorage.getItem('construction_camera_logs') || '[]');
            logs.unshift(record);
            localStorage.setItem('construction_camera_logs', JSON.stringify(logs));
            loadLogsUI();

            record.folderId = GOOGLE_FOLDER_ID;
            fetch(GOOGLE_GAS_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(record)
            }).catch(() => {});
        }

        function loadLogsUI() {
            const logs = JSON.parse(localStorage.getItem('construction_camera_logs') || '[]');
            const tbody = document.getElementById('logTableBody');
            document.getElementById('logCount').innerText = `総件数: ${logs.length} 件`;

            tbody.innerHTML = logs.map(log => `
                <tr>
                    <td class="p-2"><img src="${log.thumbnail}" class="w-10 h-10 object-cover rounded border border-zinc-700"></td>
                    <td class="p-2"><div class="font-mono text-[9px] text-slate-400">${log.dateTime}</div><div class="font-bold text-emerald-400 text-[10px]">${log.user}</div></td>
                    <td class="p-2"><div class="font-bold">${log.project}</div><div class="text-slate-400 text-[10px]">${log.type}</div></td>
                    <td class="p-2"><div>${log.location}</div><div class="text-slate-400 text-[10px] truncate max-w-[100px]">${log.remarks}</div></td>
                    <td class="p-2 font-mono text-[9px] text-slate-400">${log.gps}</td>
                </tr>
            `).join('');
        }

        function exportCSV() {
            const logs = JSON.parse(localStorage.getItem('construction_camera_logs') || '[]');
            if (logs.length === 0) return alert("ログデータがありません。");
            let csvContent = "\uFEFFID,日時,撮影者,工事名,工種,測点,備考,GPS,ファイル名\n";
            logs.forEach(log => {
                csvContent += `${log.id},"${log.dateTime}","${log.user}","${log.project}","${log.type}","${log.location}","${log.remarks}","${log.gps}","${log.fileName}"\n`;
            });
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = `現場撮影台帳ログ_${new Date().toISOString().slice(0,10)}.csv`;
            link.click();
        }

        function clearLogs() {
            if (confirm("撮影ログ履歴を削除しますか？")) {
                localStorage.removeItem('construction_camera_logs');
                loadLogsUI();
            }
        }

        function toggleModal(modalId, show) {
            document.getElementById(modalId).style.display = show ? 'flex' : 'none';
        }
    </script>
</body>
